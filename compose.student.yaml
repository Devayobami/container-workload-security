services:
  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - appnet

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-workload_lab}
      DB_USER: ${MYSQL_USER:-labuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-lab-password-change-me}
    # Intentionally runs as the image's default user and has no hardening options.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workload_lab}
      MYSQL_USER: ${MYSQL_USER:-labuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab-password-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-password-change-me}
    ports:
      - "3306:3306" # Intentionally published for the attack-surface exercise.
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root-password-change-me}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - appnet

volumes:
  dbdata:

networks:
  appnet:
    driver: bridge
